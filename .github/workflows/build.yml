name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Susun struktur folder
        run: |
          mkdir -p src/main/java/com/boxpvp/abilities src/main/resources
          mv *.java src/main/java/com/boxpvp/abilities/
          mv plugin.yml config.yml src/main/resources/
      - name: Build
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: BoxPVPAbilities
          path: target/BoxPVPAbilities-*.jar
